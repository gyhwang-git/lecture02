<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="황가연 — 도시설계 소개 페이지" />
    <title>황가연 — Urban Design</title>
    <style>
      :root {
        --ink: #17211d;
        --paper: #f5f4ed;
        --accent: #496b5a;
        --line: #c7cec4;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      }
      main { max-width: 960px; margin: 0 auto; padding: 28px 28px 72px; }
      nav { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; }
      .mark { letter-spacing: .08em; font-weight: 700; }
      nav a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--ink); }
      .hero { min-height: 67vh; display: grid; align-content: center; gap: 28px; }
      .eyebrow { color: var(--accent); letter-spacing: .11em; font-size: .78rem; font-weight: 700; }
      h1 { margin: 0; font-size: clamp(3.6rem, 12vw, 8.8rem); letter-spacing: -.075em; line-height: .82; font-weight: 800; }
      .lead { max-width: 570px; margin: 0; font-size: clamp(1.25rem, 2.7vw, 2rem); line-height: 1.55; letter-spacing: -.035em; }
      .rule { height: 1px; background: var(--line); }
      section { display: grid; grid-template-columns: 170px 1fr; gap: 28px; padding: 46px 0; border-bottom: 1px solid var(--line); }
      h2 { margin: 0; color: var(--accent); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
      .copy { margin: 0; max-width: 650px; font-size: 1.1rem; line-height: 1.8; }
      .topics { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; }
      .topics li { padding: 8px 12px; border: 1px solid var(--ink); border-radius: 100px; font-size: .92rem; }
      footer { padding-top: 28px; color: var(--accent); font-size: .85rem; }
      @media (max-width: 620px) {
        main { padding-inline: 20px; }
        section { grid-template-columns: 1fr; gap: 16px; }
        .hero { min-height: 62vh; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="주 메뉴">
        <span class="mark">HGY / 01</span>
        <a href="https://github.com/gyhwang-git" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>

      <header class="hero">
        <span class="eyebrow">URBAN DESIGN</span>
        <h1>황가연</h1>
        <p class="lead">도시의 일상과 공간의 가능성을 관찰하며, 더 나은 도시의 장면을 설계합니다.</p>
      </header>

      <div class="rule"></div>

      <section>
        <h2>About</h2>
        <p class="copy">사람과 장소가 만나는 방식에 관심을 두고 도시를 읽습니다. 복잡한 도시의 조건 속에서 공공성, 연결성, 그리고 일상의 경험을 살피며 지속 가능한 공간의 방향을 탐색합니다.</p>
      </section>

      <section>
        <h2>Focus</h2>
        <ul class="topics">
          <li>도시공간</li>
          <li>공공성</li>
          <li>보행 경험</li>
          <li>지역의 맥락</li>
          <li>지속 가능성</li>
        </ul>
      </section>

      <footer>© 2026 Hwang Gayeon</footer>
    </main>
  </body>
</html>
